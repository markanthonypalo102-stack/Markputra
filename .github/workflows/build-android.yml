
name: Build Mputra Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python required by Chaquopy
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install Python smoke-test dependencies
        run: python -m pip install --disable-pip-version-check numpy Pillow

      - name: Validate Python source and live-analysis bridge
        run: |
          python -m py_compile app/src/main/python/putra.py app/src/main/python/putra_android_bridge.py app/src/main/python/cv2_compat.py tests/test_android_bridge.py tests/test_cv2_compat.py
          python tests/test_cv2_compat.py
          python tests/test_android_bridge.py

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage direct-download APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Mputra.apk
          sha256sum output/Mputra.apk | tee output/SHA256SUMS.txt

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mputra-Android-APK
          path: output/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct-download GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mputra-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" output/Mputra.apk output/SHA256SUMS.txt \
            --title "Mputra Android app build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatically built from commit ${GITHUB_SHA}. The app display name remains PUTRA and uses the on-device Python analysis engine. Install only if you trust this repository. Each CI build uses a debug signing certificate, so uninstall a prior APK before installing a build with a different certificate."
